name: Fork Sync

permissions:
    contents: write

on:
    schedule:
        - cron: "0 0 * * *"  # 每天 UTC 00:00（北京 08:00）执行
    workflow_dispatch:  # 允许手动触发

jobs:
    sync_with_upstream:
        name: Sync with Upstream
        runs-on: ubuntu-latest
        if: ${{ github.event.repository.fork }}

        steps:
            # 这里必须用 PAT 而不是 GITHUB_TOKEN：
            # GITHUB_TOKEN 是 GitHub App 身份，无权创建或修改
            # .github/workflows/ 下的任何文件，上游一旦新增 workflow
            # 文件就会 push 被拒。PAT 是你本人身份，带 workflow scope 即可。
            - name: Checkout target repo
              uses: actions/checkout@v5
              with:
                token: ${{ secrets.SYNC_PAT }}
                fetch-depth: 0

            - name: Sync Upstream
              uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.3
              with:
                  target_repo_token: ${{ secrets.SYNC_PAT }}
                  upstream_sync_repo: huangxd-/danmu_api
                  upstream_sync_branch: main
                  target_sync_branch: main
                  test_mode: false

            - name: Check for new commits
              if: success()
              run: echo "Sync completed successfully"

            - name: Check for Failure
              if: failure()
              run: |
                  echo "[Error] Sync failed. This might be due to:"
                  echo "1. Changes in the upstream workflow file"
                  echo "2. Merge conflicts that need manual resolution"
                  echo "3. Network issues"
                  echo "4. SYNC_PAT secret missing / expired / lacking 'workflow' scope"
                  echo "Please check the logs and consider manual sync if needed."
                  exit 1
